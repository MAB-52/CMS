<div class="wrap" [attr.data-tone]="tone">
  <div class="brand-bar" aria-hidden="true"></div>

  <p-button icon="pi pi-times" [rounded]="true" [text]="true" severity="secondary" size="small"
    ariaLabel="Close dialog" styleClass="close-x" (onClick)="cancel()" />

  <div class="hero">
    <span class="icon-ring" aria-hidden="true">
      <span class="icon-tile"><i [class]="iconClass()"></i></span>
    </span>
    <h2 class="title">{{ data.title }}</h2>
    <p class="body">{{ data.body }}</p>
  </div>

  @if (data.identity; as who) {
    <div class="identity">
      <p-avatar [label]="who.initials" shape="circle" size="large" styleClass="identity-avatar" />
      <div class="identity-copy">
        @if (who.caption) { <span class="identity-caption">{{ who.caption }}</span> }
        <span class="identity-name">{{ who.name }}</span>
        @if (who.sub) { <span class="identity-sub">{{ who.sub }}</span> }
      </div>
      <i class="pi pi-verified identity-badge" aria-hidden="true"></i>
    </div>
  }

  @if (data.infoPanel) {
    <p-message severity="info" icon="pi pi-info-circle" styleClass="info-panel">{{ data.infoPanel }}</p-message>
  }

  <div class="actions">
    <p-button
      [label]="data.cancelLabel || 'Cancel'"
      severity="secondary"
      [outlined]="true"
      [rounded]="true"
      styleClass="cancel-btn"
      (onClick)="cancel()"
    />
    <p-button
      [label]="data.confirmLabel || 'Confirm'"
      [icon]="data.confirmIcon || ''"
      iconPos="right"
      [severity]="confirmSeverity()"
      [rounded]="true"
      styleClass="confirm-btn"
      [autofocus]="tone !== 'warn'"
      (onClick)="confirm()"
    />
  </div>
</div>
