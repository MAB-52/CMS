<div class="wrap" [attr.data-tone]="data.confirmColor || 'primary'">

  <!-- Brand bar -->
  <div class="brand-bar" aria-hidden="true"></div>

  <!-- Icon -->
  @if (data.icon) {
    <div
      class="icon-wrap"
      [style.background]="data.iconColor || null"
      aria-hidden="true"
    >
      <mat-icon class="icon">{{ materialIcon() }}</mat-icon>
    </div>
  }

  <!-- Title -->
  <h2 class="title" mat-dialog-title>
    {{ data.title }}
  </h2>

  <!-- Body -->
  <p class="body">
    {{ data.body }}
  </p>

  <!-- Info Panel -->
  @if (data.infoPanel) {
    <div class="info-panel">
      <mat-icon aria-hidden="true">info</mat-icon>
      <span>{{ data.infoPanel }}</span>
    </div>
  }

  <!-- Actions -->
  <div class="actions">

    <button
      type="button"
      mat-stroked-button
      class="cancel-btn"
      mat-dialog-close
    >
      {{ data.cancelLabel || 'Cancel' }}
    </button>

    @if (data.confirmColor === 'success') {

      <button
        type="button"
        mat-flat-button
        class="success-btn"
        [mat-dialog-close]="true"
      >
        {{ data.confirmLabel || 'Confirm' }}
      </button>

    } @else {

      <button
        type="button"
        mat-flat-button
        class="confirm-btn"
        [color]="matColor()"
        [mat-dialog-close]="true"
        cdkFocusInitial
      >
        {{ data.confirmLabel || 'Confirm' }}
      </button>

    }

  </div>

</div>
