<div class="toast toast--{{ toast.type }}" [attr.role]="toast.type === 'error' || toast.type === 'warning' ? 'alert' : 'status'">
  <div class="toast-head">
    <div class="toast-icon" aria-hidden="true">
      <span class="material-icons-round">{{ icon() }}</span>
    </div>
    <div class="toast-body">
      <div class="toast-title">{{ toast.title }}</div>
      @if (toast.message) {
        <div class="toast-msg">{{ toast.message }}</div>
      }
    </div>
    <button type="button" class="toast-close" (click)="dismiss.emit(toast.id)" aria-label="Dismiss notification">
      <span class="material-icons-round" aria-hidden="true">close</span>
    </button>
  </div>
  <div class="toast-progress">
    <div
      class="toast-progress-bar"
      [style.animation-duration.ms]="animDurationMs()"
    ></div>
  </div>
</div>
