<div class="mis-page">
  <header class="mis-header">
    <div class="mis-header-text">
      <p class="mis-eyebrow">Admin · Reports</p>
      <h1>MIS Reports</h1>
      <p class="mis-lede">
        Management information for consent operations, compliance posture, and channel performance.
      </p>
    </div>
  </header>

  <!-- Lazy: each report loads when first opened, then stays cached (filters survive tab switches). -->
  <p-tabs [value]="activeTab()" (valueChange)="activeTab.set($any($event))" [scrollable]="true" [lazy]="true" class="mis-tabs">
    <p-tablist>
      @for (t of tabs; track t.value) {
        <!-- p-tab applies PrimeNG's Ripple itself; adding pRipple here would duplicate it (NG0309). -->
        <p-tab [value]="t.value" class="mis-tab" [style.--c]="t.color">
          <span class="mis-tab__ico" aria-hidden="true"><i [class]="t.icon"></i></span>
          <span class="mis-tab__label">{{ t.label }}</span>
        </p-tab>
      }
    </p-tablist>

    <p-tabpanels>
      <p-tabpanel value="customer">
        <ng-template #content><app-mis-report-customer-consent-tab /></ng-template>
      </p-tabpanel>
      <p-tabpanel value="audit">
        <ng-template #content><app-mis-report-audit-tab /></ng-template>
      </p-tabpanel>
      <p-tabpanel value="expiry">
        <ng-template #content><app-mis-report-expiry-tab /></ng-template>
      </p-tabpanel>
      <p-tabpanel value="operational">
        <ng-template #content><app-mis-report-operational-tab /></ng-template>
      </p-tabpanel>
      <p-tabpanel value="inventory">
        <ng-template #content><app-mis-report-consent-inventory-tab /></ng-template>
      </p-tabpanel>
      <p-tabpanel value="channels">
        <ng-template #content><app-mis-report-channel-deep-dive-tab /></ng-template>
      </p-tabpanel>
      <p-tabpanel value="leaderboard">
        <ng-template #content><app-mis-report-consent-leaderboard-tab /></ng-template>
      </p-tabpanel>
    </p-tabpanels>
  </p-tabs>
</div>
