<div class="mis-page">
  <header class="mis-header">
    <div class="mis-header-text">
      <p class="mis-eyebrow">Admin · Reports</p>
      <h1>MIS Reports</h1>
      <p class="mis-lede">
        Management information for consent operations, compliance posture, and channel performance.
      </p>
    </div>
  </header>

  <mat-tab-group class="mis-tabs" animationDuration="200ms" dynamicHeight>
    <mat-tab>
      <ng-template mat-tab-label>
        <span class="tab-label"><mat-icon aria-hidden="true">groups</mat-icon> Customer Consent</span>
      </ng-template>
      <ng-template matTabContent>
        <app-mis-report-customer-consent-tab />
      </ng-template>
    </mat-tab>

    <mat-tab>
      <ng-template mat-tab-label>
        <span class="tab-label"><mat-icon aria-hidden="true">description</mat-icon> Consent Audit</span>
      </ng-template>
      <ng-template matTabContent>
        <app-mis-report-audit-tab />
      </ng-template>
    </mat-tab>

    <mat-tab>
      <ng-template mat-tab-label>
        <span class="tab-label"><mat-icon aria-hidden="true">event_busy</mat-icon> Expiry</span>
      </ng-template>
      <ng-template matTabContent>
        <app-mis-report-expiry-tab />
      </ng-template>
    </mat-tab>

    <mat-tab>
      <ng-template mat-tab-label>
        <span class="tab-label"><mat-icon aria-hidden="true">bar_chart</mat-icon> Operational</span>
      </ng-template>
      <ng-template matTabContent>
        <app-mis-report-operational-tab />
      </ng-template>
    </mat-tab>

    <mat-tab>
      <ng-template mat-tab-label>
        <span class="tab-label"><mat-icon aria-hidden="true">inventory_2</mat-icon> Consent inventory</span>
      </ng-template>
      <ng-template matTabContent>
        <app-mis-report-consent-inventory-tab />
      </ng-template>
    </mat-tab>

    <mat-tab>
      <ng-template mat-tab-label>
        <span class="tab-label"><mat-icon aria-hidden="true">grid_view</mat-icon> Channel deep-dive</span>
      </ng-template>
      <ng-template matTabContent>
        <app-mis-report-channel-deep-dive-tab />
      </ng-template>
    </mat-tab>

    <mat-tab>
      <ng-template mat-tab-label>
        <span class="tab-label"><mat-icon aria-hidden="true">emoji_events</mat-icon> Leaderboard</span>
      </ng-template>
      <ng-template matTabContent>
        <app-mis-report-consent-leaderboard-tab />
      </ng-template>
    </mat-tab>
  </mat-tab-group>
</div>
